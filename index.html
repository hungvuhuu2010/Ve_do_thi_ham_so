<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vẽ Đồ Thị Hàm Số Lượng Giác</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome cho các icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="script.js"></script>

</head>
<body>
    <div class="app-container">
        <!-- Tiêu đề ứng dụng -->
        <header class="app-header">
            <h1><i class="fa-solid fa-chart-line"></i> Vẽ Đồ Thị Hàm Số Lượng Giác</h1>
        </header>

        <!-- Bố cục chính: Bảng điều khiển (trái) và Mặt phẳng tọa độ (phải) -->
        <main class="app-main">
            <!-- KHU VỰC BÊN TRÁI: BẢNG ĐIỀU KHIỂN -->
            <aside class="control-panel">
                <div class="panel-section">
    <h3><i class="fa-solid fa-sliders"></i> Thiết lập hàm số</h3>
    
    <!-- Thanh Tab chứa các hàm số và nút (+) -->
    <div class="tab-header-container" id="tab-header-container">
        <div class="tabs-list" id="tabs-list">
            <!-- Các tab sẽ được sinh tự động bằng JS -->
        </div>
        <button id="btn-add-tab" class="btn-add-tab" title="Thêm hàm số mới">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- Khung chứa nội dung của Tab đang chọn (Active Card) -->
    <div id="function-cards-container">
        <!-- Nội dung card sẽ được render động theo tab active -->
    </div>
</div>

<div class="panel-section">
    <div class="input-group">
        <label for="ox-unit-select">Đơn vị trục Ox:</label>
        <select id="ox-unit-select">
            <option value="1">Số nguyên (1, 2, 3...)</option>
            <option value="pi">π</option>
            <option value="pi/2">π/2</option>
            <option value="pi/4" selected>π/4</option>
        </select>
    </div>
</div>

                <div class="panel-section action-buttons">
    <button id="btn-draw-all" class="btn btn-primary">
        <i class="fa-solid fa-play"></i> Vẽ tất cả đồ thị
    </button>
    <button id="btn-export" class="btn btn-success">
        <i class="fa-solid fa-download"></i> Xuất PNG
    </button>
</div>

                <div class="panel-section">
                    <h3><i class="fa-solid fa-magnifying-glass"></i> Điều khiển hiển thị</h3>
                    <div class="zoom-pan-controls">
                        <button id="btn-zoom-in" class="btn btn-icon" title="Phóng to"><i class="fa-solid fa-plus"></i></button>
                        <button id="btn-zoom-out" class="btn btn-icon" title="Thu nhỏ"><i class="fa-solid fa-minus"></i></button>
                        <button id="btn-reset-view" class="btn btn-secondary" title="Khôi phục mặc định">Reset góc nhìn</button>
                    </div>
                    <small class="hint">Mẹo: Có thể dùng chuột kéo (Pan) hoặc cuộn chuột (Zoom) trực tiếp trên mặt phẳng tọa độ.</small>
                </div>

                <!-- Khu vực thông báo lỗi -->
                <div id="error-message" class="error-banner" style="display: none;"></div>
            </aside>

            <!-- KHU VỰC BÊN PHẢI: MẶT PHẲNG TỌA ĐỘ SVG -->
            <section class="graph-viewport">
                <svg id="coordinate-system" width="100%" height="100%">
                    <!-- Các thành phần SVG sẽ được sinh tự động bằng script.js -->
                </svg>
                
                <!-- Hiển thị tọa độ khi di chuột -->
                <div id="cursor-coords" class="cursor-coords">x: 0.00, y: 0.00</div>
            </section>
        </main>
    </div>
</body>
</html>
